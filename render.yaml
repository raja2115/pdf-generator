services:
  - type: web
    name: pdf-generator
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --timeout 120 app:app
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: AI_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
