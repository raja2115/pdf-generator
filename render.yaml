services:
  - type: web
    name: pdf-generator
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: PEXELS_API_KEY
        sync: false
      - key: AI_MODEL
        value: google/gemini-2.5-pro
